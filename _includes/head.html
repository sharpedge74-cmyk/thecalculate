<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<!-- ============ OPEN GRAPH META TAGS ============ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="IMRango">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Free Bra &amp; Cup Size Calculators{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Calculate your exact bra size in seconds with IMRango's free calculators — band, cup, sister sizing, and international conversions.{% endif %}">
<meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<meta property="og:image" content="{{ site.url }}/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">

<!-- ============ TWITTER META TAGS ============ -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@iamrango">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}Free Bra &amp; Cup Size Calculators{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}Calculate your exact bra size in seconds — free, private, and accurate.{% endif %}">
<meta name="twitter:image" content="{{ site.url }}/assets/img/og-image.jpg">
